services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: bugtracker
      POSTGRES_USER: bugtracker
      POSTGRES_PASSWORD: bugtracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bugtracker -d bugtracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: pgsty/silo:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
  minio_data:
