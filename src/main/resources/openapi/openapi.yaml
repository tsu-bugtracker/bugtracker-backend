                $ref: "#/components/schemas/ProjectDashboard"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/projects/{projectId}/metrics:
    get:
      tags: [Analytics]
      operationId: getProjectMetrics
      summary: Метрики проекта
      description: Доступно роли TEAM_LEAD. Возвращает метрики проекта за указанный период.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectIdPath"
        - name: from
          in: query
          required: false
          description: Начало периода.
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: Конец периода.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Метрики проекта.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMetrics"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/projects/{projectId}/reports:
    get:
      tags: [Analytics]
      operationId: getProjectPeriodReport
      summary: Отчёт за период
      description: Доступно роли TEAM_LEAD. Возвращает отчёт по проекту за обязательный период с опциональной фильтрацией по компоненту и релизу.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectIdPath"
        - name: from
          in: query
          required: true
          description: Начало периода.
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          description: Конец периода.
          schema:
            type: string
            format: date
        - name: componentId
          in: query
          required: false
          description: Фильтр по компоненту.
          schema:
            type: string
            format: uuid
        - name: releaseId
          in: query
          required: false
          description: Фильтр по релизу.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Отчёт за период.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeriodReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/projects/{projectId}/reports/export:
    get:
      tags: [Analytics]
      operationId: exportProjectReport
      summary: Экспорт отчёта за период
      description: Доступно роли TEAM_LEAD. Экспортирует отчёт за обязательный период в выбранном формате.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectIdPath"
        - name: from
          in: query
          required: true
          description: Начало периода.
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          description: Конец периода.
          schema:
            type: string
            format: date
        - name: componentId
          in: query
          required: false
          description: Фильтр по компоненту.
          schema:
            type: string
            format: uuid
        - name: releaseId
          in: query
          required: false
          description: Фильтр по релизу.
          schema:
            type: string
            format: uuid
        - name: format
          in: query
          required: true
          description: Формат экспорта.
          schema:
            $ref: "#/components/schemas/ReportExportFormat"
      responses:
        "200":
          description: Отчёт в выбранном формате.
          content:
            text/csv:
              schema:
                type: string
            application/pdf:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                $ref: "#/components/schemas/PeriodReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/analytics/summary:
    get:
      tags: [Analytics]
      operationId: getSummaryAnalytics
      summary: Сводная аналитика
      description: Доступно роли OBSERVER и администратору (`isAdmin=true`). Возвращает сводную аналитику с опциональной фильтрацией по проекту и периоду.
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: query
          required: false
          description: Фильтр по проекту.
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          required: false
          description: Начало периода.
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: Конец периода.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Сводная аналитика.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SummaryAnalytics"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      required: false
      description: Номер страницы (начиная с 0).
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      description: Размер страницы (от 1 до 100).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    UserIdPath:
      name: userId
      in: path
      required: true
      description: Идентификатор пользователя.
      schema:
        type: string
        format: uuid
    ProjectIdPath:
      name: projectId
      in: path
      required: true
      description: Идентификатор проекта.
      schema:
        type: string
        format: uuid
    MemberIdPath:
      name: memberId
      in: path
      required: true
      description: Идентификатор участника проекта.
      schema:
        type: string
        format: uuid
    InvitationIdPath:
      name: invitationId
      in: path
      required: true
      description: Идентификатор приглашения.
      schema:
        type: string
        format: uuid
    ComponentIdPath:
      name: componentId
      in: path
      required: true
      description: Идентификатор компонента.
      schema:
        type: string
        format: uuid
    LabelIdPath:
      name: labelId
      in: path
      required: true
      description: Идентификатор метки.
      schema:
        type: string
        format: uuid
    BugIdPath:
      name: bugId
      in: path
      required: true
      description: Идентификатор бага.
      schema:
        type: string
        format: uuid
    CommentIdPath:
      name: commentId
      in: path
      required: true
      description: Идентификатор комментария.
      schema:
        type: string
        format: uuid
    AttachmentIdPath:
      name: attachmentId
      in: path
      required: true
      description: Идентификатор вложения.
      schema:
        type: string
        format: uuid
    LinkIdPath:
      name: linkId
      in: path
      required: true
      description: Идентификатор связи.
      schema:
        type: string
        format: uuid
    ReleaseIdPath:
      name: releaseId
      in: path
      required: true
      description: Идентификатор релиза.
      schema:
        type: string
        format: uuid
    CommitLinkIdPath:
      name: commitLinkId
      in: path
      required: true
      description: Идентификатор связи коммита с багом.
      schema:
        type: string
        format: uuid
    NotificationIdPath:
      name: notificationId
      in: path
      required: true
      description: Идентификатор уведомления.
      schema:
        type: string
        format: uuid
    SubscriptionIdPath:
      name: subscriptionId
      in: path
      required: true
      description: Идентификатор подписки.
      schema:
        type: string
        format: uuid
    InvitationTokenPath:
      name: token
      in: path
      required: true
      description: Токен приглашения.
      schema:
        type: string

  responses:
    BadRequest:
      description: Некорректный запрос.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Пользователь не авторизован.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Недостаточно прав.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Ресурс не найден.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Конфликт состояния ресурса.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnprocessableEntity:
      description: Данные не могут быть обработаны.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    # ===== Common & Errors =====
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          description: Health status
        service:
          type: string
          description: Service name
      required: [status, service]

    MessageResponse:
      type: object
      properties:
        message:
          type: string
          description: Response message
      required: [message]

    ErrorDetail:
      type: object
      properties:
        field:
          type: string
          description: Field name
        message:
          type: string
          description: Error message
      required: [field, message]

    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
          description: Error timestamp
        status:
          type: integer
          description: HTTP status
        error:
          type: string
          description: Error name
        code:
          type: string
          description: Error code
        message:
          type: string
          description: Error message
        path:
          type: string
          description: Request path
        details:
          type: array
          description: Field errors
          items:
            $ref: "#/components/schemas/ErrorDetail"
      required: [timestamp, status, error, code, message, path]

    UserShort:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: User ID
        email:
          type: string
          format: email
          description: User email
        fullName:
          type: string
          description: Full name
        avatarUrl:
          type: ["string", "null"]
          description: Avatar URL
      required: [id, email, fullName]

    # ===== Auth / Profile / Admin =====
    UserStatus:
      type: string
      description: User status
      enum: [ACTIVE, BLOCKED, DEACTIVATED]

    ProjectRole:
      type: string
      description: Project role
      enum: [TEAM_LEAD, DEVELOPER, TESTER, OBSERVER]

    ProjectStatus:
      type: string
      description: Project status
      enum: [ACTIVE, ARCHIVED]

    InvitationStatus:
      type: string
      description: Invitation status
      enum: [PENDING, ACCEPTED, CANCELLED, EXPIRED]

    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          description: User email
        password:
          type: string
          minLength: 8
          description: Account password
        fullName:
          type: string
          description: Full name
        invitationToken:
          type: ["string", "null"]
          description: Invitation token
      required: [email, password, fullName]

    VerifyEmailRequest:
      type: object
      properties:
        token:
          type: string
          description: Verification token
      required: [token]

    ResendVerificationRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          description: User email
      required: [email]

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          description: User email
        password:
          type: string
          description: Account password
      required: [email, password]

    RefreshTokenRequest:
      type: object
      properties:
        refreshToken:
          type: string
          description: Refresh token
      required: [refreshToken]

    LogoutRequest:
      type: object
      properties:
        refreshToken:
          type: ["string", "null"]
          description: Refresh token

    PasswordResetRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          description: User email
      required: [email]

    PasswordResetConfirmRequest:
      type: object
      properties:
        token:
          type: string
          description: Reset token
        newPassword:
          type: string
          minLength: 8
          description: New password
      required: [token, newPassword]

    ChangePasswordRequest:
      type: object
      properties:
        currentPassword:
          type: string
          description: Current password
        newPassword:
          type: string
          minLength: 8
          description: New password
      required: [currentPassword, newPassword]

    UpdateProfileRequest:
      type: object
      properties:
        fullName:
          type: string
          description: Full name
        avatarUrl:
          type: ["string", "null"]
          description: Avatar URL

    UserProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: User ID
        email:
          type: string
          format: email
          description: User email
        fullName:
          type: string
          description: Full name
        avatarUrl:
          type: ["string", "null"]
          description: Avatar URL
        isAdmin:
          type: boolean
          description: Admin flag
        emailVerified:
          type: boolean
          description: Email verified
        status:
          $ref: "#/components/schemas/UserStatus"
        canCreateProjects:
          type: boolean
          description: Can create projects
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp
      required:
        [
          id,
          email,
          fullName,
          isAdmin,
          emailVerified,
          status,
          canCreateProjects,
          createdAt,
        ]

    AuthTokensResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: Access token
        refreshToken:
          type: string
          description: Refresh token
        tokenType:
          type: string
          description: Token type
        expiresIn:
          type: integer
          format: int64
          description: Expiry seconds
        user:
          $ref: "#/components/schemas/UserProfile"
      required: [accessToken, refreshToken, tokenType, expiresIn, user]

    NotificationChannelConfig:
      type: object
      properties:
        inApp:
          type: boolean
          description: In-app channel
        email:
          type: boolean
          description: Email channel
      required: [inApp, email]

    NotificationSettings:
      type: object
      properties:
        inAppEnabled:
          type: boolean
          description: In-app enabled
        emailEnabled:
          type: boolean
          description: Email enabled
        events:
          type: object
          description: Per-event settings
          properties:
            bugCreated:
              $ref: "#/components/schemas/NotificationChannelConfig"
            bugAssigned:
              $ref: "#/components/schemas/NotificationChannelConfig"
            bugStatusChanged:
              $ref: "#/components/schemas/NotificationChannelConfig"
            bugCommented:
              $ref: "#/components/schemas/NotificationChannelConfig"
            mention:
              $ref: "#/components/schemas/NotificationChannelConfig"
            projectInvited:
              $ref: "#/components/schemas/NotificationChannelConfig"
            releasePublished:
              $ref: "#/components/schemas/NotificationChannelConfig"
      required: [inAppEnabled, emailEnabled, events]

    UserProjectMembership:
      type: object
      properties:
        projectId:
          type: string
          format: uuid
          description: Project ID
        projectName:
          type: string
          description: Project name
        role:
          $ref: "#/components/schemas/ProjectRole"
        projectStatus:
          $ref: "#/components/schemas/ProjectStatus"
      required: [projectId, projectName, role, projectStatus]

    AdminUserSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: User ID
        email:
          type: string
          format: email
          description: User email
        fullName:
          type: string
          description: Full name
        isAdmin:
          type: boolean
          description: Admin flag
        emailVerified:
          type: boolean
          description: Email verified
        status:
          $ref: "#/components/schemas/UserStatus"
        projectsCount:
          type: integer
          description: Projects count
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
      required:
        [
          id,
          email,
          fullName,
          isAdmin,
          emailVerified,
          status,
          projectsCount,
          createdAt,
        ]

    PagedAdminUserSummary:
      type: object
      properties:
        items:
          type: array
          description: Page items
          items:
            $ref: "#/components/schemas/AdminUserSummary"
        page:
          type: integer
          description: Page number
        size:
          type: integer
          description: Page size
        totalElements:
          type: integer
          format: int64
          description: Total elements
        totalPages:
          type: integer
          description: Total pages
      required: [items, page, size, totalElements, totalPages]

    AdminUserDetails:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: User ID
        email:
          type: string
          format: email
          description: User email
        fullName:
          type: string
          description: Full name
        avatarUrl:
          type: ["string", "null"]
          description: Avatar URL
        isAdmin:
          type: boolean
          description: Admin flag
        emailVerified:
          type: boolean
          description: Email verified
        status:
          $ref: "#/components/schemas/UserStatus"
        canCreateProjects:
          type: boolean
          description: Can create projects
        blockedReason:
          type: ["string", "null"]
          description: Block reason
        projects:
          type: array
          description: Project memberships
          items:
            $ref: "#/components/schemas/UserProjectMembership"
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp
      required:
        [
          id,
          email,
          fullName,
          isAdmin,
          emailVerified,
          status,
          canCreateProjects,
          projects,
          createdAt,
        ]

    BlockUserRequest:
      type: object
      properties:
        reason:
          type: ["string", "null"]
          description: Block reason

    DeactivateUserRequest:
      type: object
      properties:
        reason:
          type: ["string", "null"]
          description: Deactivation reason

    AdminRoleRequest:
      type: object
      properties:
        isAdmin:
          type: boolean
          description: Admin flag
      required: [isAdmin]

    AuditLogEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Entry ID
        actor:
          oneOf:
            - $ref: "#/components/schemas/UserShort"
            - type: "null"
        action:
          type: string
          description: Action name
        targetType:
          type: string
          description: Target type
        targetId:
          type: ["string", "null"]
          format: uuid
          description: Target ID
        details:
          type: object
          description: Action details
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
      required: [id, action, targetType, createdAt]

    PagedAuditLogEntry:
      type: object
      properties:
        items:
          type: array
          description: Page items
          items:
            $ref: "#/components/schemas/AuditLogEntry"
        page:
          type: integer
          description: Page number
        size:
          type: integer
          description: Page size
        totalElements:
          type: integer
          format: int64
          description: Total elements
        totalPages:
          type: integer
          description: Total pages
      required: [items, page, size, totalElements, totalPages]

    # ===== Projects / Team / Components / Labels =====
    CreateProjectRequest:
      type: object
      properties:
        name:
          type: string
          description: Project name
        description:
          type: ["string", "null"]
          description: Project description
        techStack:
          type: ["string", "null"]
          description: Technology stack
        gitRepositoryUrl:
          type: ["string", "null"]
          format: uri
          description: Git repository URL
        startDate:
          type: ["string", "null"]
          format: date
          description: Start date
        endDate:
          type: ["string", "null"]
          format: date
          description: End date
      required: [name]

    UpdateProjectRequest:
      type: object
      properties:
        name:
          type: string
          description: Project name
        description:
          type: ["string", "null"]
          description: Project description
        techStack:
          type: ["string", "null"]
          description: Technology stack
        startDate:
          type: ["string", "null"]
          format: date
          description: Start date
        endDate:
          type: ["string", "null"]
          format: date
          description: End date

    ProjectSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Project ID
        name:
          type: string
          description: Project name
        description:
          type: ["string", "null"]
          description: Project description
        techStack:
          type: ["string", "null"]
          description: Technology stack
        status:
          $ref: "#/components/schemas/ProjectStatus"
        bugTrackingEnabled:
          type: boolean
          description: Bug tracking flag
        myRole:
          $ref: "#/components/schemas/ProjectRole"
        openBugsCount:
          type: integer
          description: Open bugs count
        membersCount:
          type: integer
          description: Members count
        startDate:
          type: ["string", "null"]
          format: date
          description: Start date
        endDate:
          type: ["string", "null"]
          format: date
          description: End date
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
      required:
        [
          id,
          name,
          status,
          bugTrackingEnabled,
          myRole,
          openBugsCount,
          membersCount,
          createdAt,
        ]

    PagedProjectSummary:
      type: object
      properties:
        items:
          type: array
          description: Page items
          items:
            $ref: "#/components/schemas/ProjectSummary"
        page:
          type: integer
          description: Page number
        size:
          type: integer
          description: Page size
        totalElements:
          type: integer
          format: int64
          description: Total elements
        totalPages:
          type: integer
          description: Total pages
      required: [items, page, size, totalElements, totalPages]

    ProjectDetails:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Project ID
        name:
          type: string
          description: Project name
        description:
          type: ["string", "null"]
          description: Project description
        techStack:
          type: ["string", "null"]
          description: Technology stack
        status:
          $ref: "#/components/schemas/ProjectStatus"
        bugTrackingEnabled:
          type: boolean
          description: Bug tracking flag
        hasActiveTester:
          type: boolean
          description: Active tester flag
        owner:
          $ref: "#/components/schemas/UserShort"
        myRole:
          $ref: "#/components/schemas/ProjectRole"
        gitIntegration:
          oneOf:
            - $ref: "#/components/schemas/GitIntegrationResponse"
            - type: "null"
        startDate:
          type: ["string", "null"]
          format: date
          description: Start date
        endDate:
          type: ["string", "null"]
          format: date
          description: End date
        membersCount:
          type: integer
          description: Members count
