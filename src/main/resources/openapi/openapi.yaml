openapi: 3.1.0
info:
  title: Bugtracker Backend API
  version: 1.0.0
  summary: REST API бэкенда баг-трекера студенческих проектов
  description: |
    Целевая спецификация REST API сервиса баг-трекера студенческих проектов (`Bearer JWT`).
    Real-time уведомления передаются через WebSocket/STOMP (`/ws`, подписки `/user/queue/notifications` и `/topic/projects/{projectId}/events`).
tags:
  - name: Health
    description: Проверка доступности сервиса
  - name: Auth
    description: Регистрация, вход, токены и восстановление пароля
  - name: Profile
    description: Профиль текущего пользователя и настройки уведомлений
  - name: Admin
    description: Глобальное администрирование пользователей и аудит
  - name: Projects
    description: Проекты, команда, приглашения, компоненты и метки
  - name: Bugs
    description: Баги, жизненный цикл, комментарии, вложения, связи и история
  - name: Planning
    description: Планирование исправлений, назначение и личные задачи
  - name: Releases
    description: Релизы проекта
  - name: Git Integration
    description: Интеграция с Git-провайдерами, коммиты и merge request
  - name: Notifications
    description: Уведомления и подписки пользователя
  - name: Analytics
    description: Дашборды, метрики и отчёты по проектам
security:
  - bearerAuth: []
paths:
  /api/v1/health:
    get:
      tags:
        - Health
      operationId: getHealth
      summary: Проверить состояние сервиса
      description: |
        Публичный эндпоинт. Возвращает текущий статус backend-сервиса и его имя.
      security: []
      responses:
        "200":
          description: Сервис доступен
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /api/v1/auth/register:
    post:
      tags:
        - Auth
      operationId: registerUser
      summary: Зарегистрировать пользователя
      description: |
        Публичный эндпоинт. Создаёт аккаунт гостя и отправляет письмо для
        подтверждения e-mail. Если передан `invitationToken`, регистрация
        связывается с приглашением в проект; приглашение применяется после
        подтверждения e-mail. Пароль должен содержать не менее 8 символов.
        Конфликт `409` возвращается, если e-mail уже зарегистрирован или
        приглашение не может быть применено.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: Пользователь зарегистрирован
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /api/v1/auth/verify-email:
    post:
      tags:
        - Auth
      operationId: verifyEmail
      summary: Подтвердить e-mail
      description: |
        Публичный эндпоинт. Подтверждает e-mail по одноразовому токену из письма.
        Недействительный или истёкший токен возвращает `422`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyEmailRequest" }
      responses:
        "200":
          description: E-mail подтверждён
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /api/v1/auth/resend-verification:
    post:
      tags:
        - Auth
      operationId: resendVerification
      summary: Повторно отправить письмо подтверждения
      description: |
        Публичный эндпоинт. Повторно отправляет письмо подтверждения e-mail.
        Ответ не раскрывает, существует ли аккаунт. Частые запросы могут
        ограничиваться (`409`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResendVerificationRequest" }
      responses:
        "200":
          description: Письмо отправлено
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /api/v1/auth/login:
    post:
      tags:
        - Auth
      operationId: login
      summary: Войти в систему
      description: |
        Публичный эндпоинт. Проверяет e-mail и пароль и выдаёт пару JWT-токенов.
        Вход запрещён (`403`) для неподтверждённого (`emailVerified=false`),
        заблокированного (`BLOCKED`) или деактивированного (`DEACTIVATED`)
        аккаунта. Неверные учётные данные возвращают `401`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Успешный вход
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthTokensResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /api/v1/auth/refresh:
    post:
      tags:
        - Auth
      operationId: refreshAccessToken
      summary: Обновить access-токен
      description: |
        Публичный эндпоинт. Обменивает действующий refresh-токен на новую пару
        токенов. Отозванный или истёкший токен возвращает `401`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshTokenRequest" }
      responses:
        "200":
          description: Токены обновлены
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthTokensResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /api/v1/auth/logout:
    post:
      tags:
        - Auth
      operationId: logout
      summary: Выйти из системы
      description: |
        Завершает текущую сессию и отзывает переданный refresh-токен (если указан).
        Требуется аутентификация. Повторный вызов для уже отозванного токена
        остаётся идемпотентным и возвращает `204`.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LogoutRequest" }
      responses:
        "204":
          description: Сессия завершена
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /api/v1/auth/password-reset/request:
    post:
      tags:
        - Auth
      operationId: requestPasswordReset
      summary: Запросить сброс пароля
      description: |
        Публичный эндпоинт. Отправляет письмо со ссылкой для сброса пароля.
        Ответ `202` не раскрывает, существует ли аккаунт с таким e-mail.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordResetRequest" }
      responses:
        "202":
          description: Запрос на сброс пароля принят
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /api/v1/auth/password-reset/confirm:
    post:
      tags:
        - Auth
      operationId: confirmPasswordReset
      summary: Подтвердить сброс пароля
      description: |
        Публичный эндпоинт. Устанавливает новый пароль по одноразовому токену.
        Пароль должен содержать не менее 8 символов. Недействительный или
        истёкший токен возвращает `422`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordResetConfirmRequest" }
      responses:
        "200":
          description: Пароль изменён
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /api/v1/users/me:
    get:
      tags:
        - Profile
      operationId: getCurrentProfile
      summary: Получить профиль текущего пользователя
      description: |
        Доступно любому аутентифицированному пользователю. Возвращает профиль,
        глобальную роль, статус аккаунта и право создавать проекты.
      responses:
        "200":
          description: Профиль пользователя
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    patch:
      tags:
        - Profile
      operationId: updateCurrentProfile
      summary: Обновить профиль текущего пользователя
      description: |
        Доступно любому аутентифицированному пользователю. Позволяет изменить
        отображаемое имя и URL аватара. E-mail и статус аккаунта не изменяются.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProfileRequest" }
      responses:
        "200":
          description: Профиль обновлён
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /api/v1/users/me/password:
    post:
      tags:
        - Profile
      operationId: changeCurrentPassword
      summary: Изменить пароль текущего пользователя
      description: |
        Доступно любому аутентифицированному пользователю. Требует текущий пароль;
        новый пароль должен содержать не менее 8 символов. Неверный текущий пароль
        возвращает `422`, после успешной смены все прочие refresh-токены отзываются.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "204":
          description: Пароль изменён
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /api/v1/users/me/notification-settings:
    get:
      tags:
        - Profile
      operationId: getNotificationSettings
      summary: Получить настройки уведомлений
      description: |
        Доступно любому аутентифицированному пользователю. Возвращает глобальные
        каналы (`inAppEnabled`, `emailEnabled`) и настройки по каждому событию.
      responses:
        "200":
          description: Настройки уведомлений
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    put:
      tags:
        - Profile
      operationId: updateNotificationSettings
      summary: Обновить настройки уведомлений
      description: |
        Доступно любому аутентифицированному пользователю. Полностью заменяет
        настройки уведомлений. События: `bugCreated`, `bugAssigned`,
        `bugStatusChanged`, `bugCommented`, `mention`, `projectInvited`,
        `releasePublished`; для каждого настраиваются каналы `inApp` и `email`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationSettings" }
      responses:
        "200":
          description: Настройки сохранены
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /api/v1/admin/users:
    get:
      tags:
        - Admin
      operationId: listAdminUsers
      summary: Список пользователей
      description: |
        Доступно только администратору (`isAdmin=true`). Поддерживает поиск по
        e-mail и ФИО, фильтры по статусу, глобальной роли и подтверждению e-mail,
        а также пагинацию.
      parameters:
        - name: query
          in: query
          required: false
          description: Поиск по e-mail или ФИО
          schema: { type: string }
        - name: status
          in: query
          required: false
          description: Фильтр по статусу аккаунта
          schema: { $ref: "#/components/schemas/UserStatus" }
        - name: isAdmin
          in: query
          required: false
          description: Фильтр по глобальной роли администратора
          schema: { type: boolean }
        - name: emailVerified
          in: query
          required: false
          description: Фильтр по подтверждению e-mail
          schema: { type: boolean }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Страница пользователей
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PagedAdminUserSummary" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /api/v1/admin/users/{userId}:
    get:
      tags:
        - Admin
      operationId: getAdminUser
      summary: Детали пользователя
      description: |
        Доступно только администратору (`isAdmin=true`). Возвращает профиль
        пользователя, его проекты и роли в них.
      parameters:
        - $ref: "#/components/parameters/UserIdPath"
      responses:
        "200":
          description: Детали пользователя
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserDetails" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /api/v1/admin/users/{userId}/block:
    post:
      tags:
        - Admin
      operationId: blockAdminUser
      summary: Заблокировать пользователя
      description: |
        Доступно только администратору (`isAdmin=true`). Переводит аккаунт в
        `BLOCKED` и отзывает активные сессии. Заблокировать самого себя нельзя —
        `409 Conflict`.
      parameters:
        - $ref: "#/components/parameters/UserIdPath"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BlockUserRequest" }
      responses:
        "200":
          description: Пользователь заблокирован
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserDetails" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /api/v1/admin/users/{userId}/unblock:
    post:
      tags:
        - Admin
      operationId: unblockAdminUser
      summary: Разблокировать пользователя
      description: |
        Доступно только администратору (`isAdmin=true`). Возвращает аккаунт из
        статуса `BLOCKED` в `ACTIVE`. Для деактивированного аккаунта операция
        возвращает `409 Conflict`.
      parameters:
        - $ref: "#/components/parameters/UserIdPath"
      responses:
        "200":
          description: Пользователь разблокирован
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserDetails" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /api/v1/admin/users/{userId}/password-reset:
    post:
      tags:
        - Admin
      operationId: triggerAdminUserPasswordReset
      summary: Инициировать сброс пароля пользователя
      description: |
        Доступно только администратору (`isAdmin=true`). Отправляет пользователю
        письмо со ссылкой сброса пароля. Администратор не задаёт пароль напрямую.
      parameters:
        - $ref: "#/components/parameters/UserIdPath"
      responses:
        "202":
          description: Письмо для сброса пароля отправлено
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /api/v1/admin/users/{userId}/verify-email:
    post:
      tags:
        - Admin
      operationId: verifyAdminUserEmail
      summary: Подтвердить e-mail пользователя вручную
      description: |
        Доступно только администратору (`isAdmin=true`). Устанавливает
        `emailVerified=true` без письма. Если e-mail уже подтверждён, операция
        идемпотентна и возвращает актуальные детали.
      parameters:
        - $ref: "#/components/parameters/UserIdPath"
      responses:
        "200":
          description: E-mail подтверждён
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserDetails" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
