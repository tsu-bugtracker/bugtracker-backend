      parameters:
        - name: actorId
          in: query
          required: false
          description: Идентификатор пользователя-актора
          schema: { type: string, format: uuid }
        - name: action
          in: query
          required: false
          description: Код действия (например, USER_BLOCKED)
          schema: { type: string }
        - name: targetType
          in: query
          required: false
          description: Тип цели действия (например, USER, PROJECT, BUG)
          schema: { type: string }
        - name: targetId
          in: query
          required: false
          description: Идентификатор цели действия
          schema: { type: string, format: uuid }
        - name: from
          in: query
          required: false
          description: Начало периода (включительно)
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          description: Конец периода (включительно)
