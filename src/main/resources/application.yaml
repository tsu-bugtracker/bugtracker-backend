spring:
  application:
    name: bugtracker-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  docker:
    compose:
      enabled: false

springdoc:
  api-docs:
    version: openapi_3_1
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    urls-primary-name: Current state
    urls:
      - name: Current state
        url: /v3/api-docs
      - name: Target state
        url: /openapi/openapi.yaml

app:
  swagger:
    auto-open: false
