spring:
  application:
    name: bugtracker-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  docker:
    compose:
      enabled: false
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 50MB

springdoc:
  api-docs:
    version: openapi_3_1
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    operations-sorter: alpha
    persist-authorization: true
    urls-primary-name: Current state
    urls:
      - name: Current state
        url: /v3/api-docs
      - name: Target state
        url: /openapi/openapi.yaml

app:
  swagger:
    auto-open: false
  jwt:
    secret: ${APP_JWT_SECRET:dev-super-secret-key-for-bugtracker-jwt-signing-at-least-32-bytes}
    access-expiration-ms: ${APP_JWT_ACCESS_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${APP_JWT_REFRESH_EXPIRATION_MS:2592000000}
  mail:
    from: ${APP_MAIL_FROM:noreply@bugtracker.local}
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
